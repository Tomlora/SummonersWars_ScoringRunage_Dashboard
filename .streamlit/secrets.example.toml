# Copy to secrets.toml on the server. Never commit the real file.
[auth]
redirect_uri = "https://your-dashboard.example/oauth2callback"
cookie_secret = "REPLACE-WITH-A-LONG-RANDOM-SECRET"
client_id = "YOUR-OIDC-CLIENT-ID"
client_secret = "YOUR-OIDC-CLIENT-SECRET"
server_metadata_url = "https://your-issuer.example/.well-known/openid-configuration"

# Operator-approved grants only. Neither a player name nor an export proves ownership.
[[access.accounts]]
wizard_id = 123456789
issuer = "https://your-issuer.example"
subject = "EXACT-VERIFIED-OIDC-SUBJECT"
