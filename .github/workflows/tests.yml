name: Regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swtest
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: swtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U swtest"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://swtest:test-only@localhost:5432/swtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q fonctions pages_streamlit scoring_runage.py
      - run: python -m pytest -q
